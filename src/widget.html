<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>截止线小组件</title>
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <main class="widget-shell">
    <div class="hover-controls"><button id="pinButton" aria-label="置顶" title="切换置顶" aria-pressed="false"><svg viewBox="0 0 14 14"><circle cx="7" cy="5" r="3.1"></circle><rect x="6.3" y="7.2" width="1.4" height="5" rx="0.7"></rect></svg></button><button id="closeButton" aria-label="关闭" title="关闭"><svg viewBox="0 0 14 14" class="stroke-icon"><path d="M3.5 3.5 10.5 10.5 M10.5 3.5 3.5 10.5"></path></svg></button></div>
    <div class="widget-heading"><span>截止提醒</span><strong id="widgetCount">读取中</strong></div>
    <div class="ios-list" id="widgetRows"></div>
  </main>
  <script src="widget.js"></script>
</body>
</html>
